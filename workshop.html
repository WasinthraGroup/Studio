<!DOCTYPE html>
<html lang="th">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>เวิร์กชอป | ว.Studio</title>
    <link rel="icon" href="Pics/Logo.png">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
    <script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.10/index.global.min.js"></script>
    <script src="js/script.js" defer></script>
</head>

<body class="hidden bg-[#fdfaf5]">

    <nav class="bg-white/80 backdrop-blur-md shadow-sm fixed w-full z-50">
        <div class="max-w-7xl mx-auto px-6 flex justify-between items-center h-20">
            <div class="flex items-center gap-10">
                <div class="text-xl font-bold cursor-pointer" onclick="window.location.href='.'" style="color: var(--thai-red);">
                    ว.<span>Studio</span>
                </div>
                <div id="desktopNav" class="hidden md:flex items-center gap-8"></div>
            </div>

            <div class="flex items-center gap-4">
                <div id="navAction" class="relative"></div>
                <button onclick="toggleMobileMenu()" class="md:hidden text-gray-600 p-2 hover:bg-gray-100 rounded-lg transition-colors">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16m-7 6h7" />
                    </svg>
                </button>
            </div>
        </div>

        <div id="mobileMenu" class="hidden md:hidden bg-white border-t border-gray-100 px-6 py-4 shadow-xl">
            <div id="mobileMenuLinks" class="flex flex-col gap-4"></div>
        </div>
    </nav>

    <div id="profileModal" class="hidden fixed inset-0 bg-black/60 backdrop-blur-sm z-[9999] flex items-center justify-center p-4">
        <div class="bg-white rounded-3xl w-full max-w-md overflow-hidden shadow-2xl animate__animated animate__zoomIn animate__faster">
            <div class="bg-[#721c24] px-6 py-4 flex justify-between items-center text-white">
                <h3 class="text-lg font-bold italic tracking-wide">Account Settings</h3>
                <button onclick="closeProfileModal()" class="text-2xl hover:opacity-70 transition-opacity">&times;</button>
            </div>

            <form id="profileUpdateForm" class="p-6 space-y-5">
                <div class="flex flex-col items-center gap-3">
                    <div class="relative group">
                        <img id="profilePreview" src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcT7csvPWMdfAHEAnhIRTdJKCK5SPK4cHfskow&s" 
                             class="w-24 h-24 rounded-full object-cover border-4 border-[#fdfaf5] shadow-md">
                        <label for="avatarInput" class="absolute bottom-0 right-0 bg-[#b38b59] text-white p-1.5 rounded-full cursor-pointer hover:scale-110 transition-transform shadow-lg">
                            <i class="fa-solid fa-camera text-[12px]"></i>
                        </label>
                    </div>
                    <input type="file" id="avatarInput" accept="image/*" class="hidden">
                    <p class="text-[10px] text-gray-400 font-bold uppercase">คลิกไอคอนเพื่อเปลี่ยนรูป</p>
                </div>

                <div class="space-y-4">
                    <div>
                        <label class="text-[11px] font-bold text-gray-400 uppercase tracking-widest ml-1">Username</label>
                        <input type="text" id="editUsername" class="w-full border-gray-200 border p-2.5 rounded-xl mt-1 focus:ring-2 focus:ring-[#b38b59] outline-none transition-all" placeholder="ชื่อผู้ใช้">
                    </div>
                    <div>
                        <label class="text-[11px] font-bold text-gray-400 uppercase tracking-widest ml-1">ชื่อ-นามสกุล</label>
                        <input type="text" id="editFullName" class="w-full border-gray-200 border p-2.5 rounded-xl mt-1 focus:ring-2 focus:ring-[#b38b59] outline-none transition-all" placeholder="ชื่อจริง">
                    </div>
                    <div class="bg-gray-50 p-4 rounded-2xl border border-gray-100">
                        <label class="text-[11px] font-bold text-gray-400 uppercase tracking-widest">รหัสผ่านใหม่</label>
                        <input type="password" id="newProfilePass" class="w-full border-gray-200 border p-2.5 rounded-xl mt-1 focus:ring-2 focus:ring-[#b38b59] outline-none transition-all" placeholder="••••••••">
                    </div>
                </div>

                <div class="flex gap-3 pt-2">
                    <button type="button" onclick="closeProfileModal()" class="flex-1 py-3 text-gray-500 font-bold hover:bg-gray-50 rounded-xl transition">ยกเลิก</button>
                    <button type="submit" class="flex-1 py-3 bg-[#721c24] text-white rounded-xl font-bold shadow-lg hover:opacity-90 active:scale-95 transition-all">บันทึกข้อมูล</button>
                </div>
            </form>
        </div>
    </div>

    <div class="h-20"></div>

    <main class="max-w-7xl mx-auto px-6 py-10">
        <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
            
            <div class="lg:col-span-2 space-y-6">
                <div class="bg-white p-6 rounded-2xl shadow-sm border border-gray-100">
                    <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4 mb-6">
                        <h2 class="text-xl font-bold text-gray-800">ตารางเวลาของฉัน</h2>
                        <div class="flex gap-3 text-[11px] font-bold text-gray-500">
                            <span class="flex items-center gap-1.5"><span class="w-2.5 h-2.5 bg-blue-500 rounded-full"></span> ทำงาน</span>
                            <span class="flex items-center gap-1.5"><span class="w-2.5 h-2.5 bg-yellow-500 rounded-full"></span> ลา/ไม่ว่าง</span>
                        </div>
                    </div>
                    <div id="calendar" class="min-h-[600px] overflow-hidden"></div>
                </div>
            </div>

            <div class="space-y-6">
                
                <div class="bg-white p-6 rounded-2xl shadow-sm border border-gray-100">
                    <button onclick="window.location.href='assignments.html'" class="w-full bg-[#721c24] text-white py-4 rounded-2xl font-bold shadow-lg hover:scale-[1.02] active:scale-95 transition-all flex items-center justify-center gap-3">
                        <i class="fa-solid fa-chalkboard-user text-lg"></i>
                        <span>จัดการงานทั้งหมด</span>
                    </button>
                </div>

                <div id="hrContentPanel" class="hidden bg-white p-6 rounded-3xl shadow-sm border border-gray-100">
                    <h3 class="text-lg font-bold mb-4 flex items-center gap-2">
                        <i class="fa-solid fa-plus-circle text-[#721c24]"></i> เพิ่มข่าวสาร / โปรเจกต์
                    </h3>
                    <form id="addContentForm" class="space-y-4">
                        <select id="contentType" class="w-full p-3 border rounded-xl outline-none focus:ring-1 focus:ring-[#721c24]">
                            <option value="news">ข่าวสาร (News)</option>
                            <option value="projects">โปรเจกต์ (Projects)</option>
                        </select>
                        <input type="text" id="contentTitle" placeholder="หัวข้อ" class="w-full p-3 border rounded-xl outline-none" required>
                        <textarea id="contentDesc" placeholder="รายละเอียด" class="w-full p-3 border rounded-xl outline-none" rows="3" required></textarea>
                        <input type="url" id="contentImage" placeholder="ลิงก์รูปภาพ (https://...)" class="w-full p-3 border rounded-xl outline-none">
                        <input type="url" id="contentLink" placeholder="ลิงก์นำทางไปยังเนื้อหา" class="w-full p-3 border rounded-xl outline-none">
                        <button type="submit" class="w-full bg-gray-800 text-white py-3 rounded-xl font-bold hover:bg-black transition-colors">โพสต์ลงหน้าเว็บ</button>
                    </form>
                </div>

                <div id="invitePanel" class="hidden bg-white p-6 rounded-2xl shadow-sm border border-red-50">
                    <h3 class="font-bold text-red-700 mb-4 flex items-center gap-2">
                        <i class="fa-solid fa-user-plus"></i> สร้างลิงก์เชิญพนักงาน
                    </h3>
                    <form id="createInviteForm" class="space-y-4">
                        <div class="space-y-1">
                            <label class="text-[10px] font-bold text-gray-400 uppercase">วันหมดอายุของลิงก์</label>
                            <input type="datetime-local" id="inviteExpire" class="w-full border p-2.5 rounded-xl text-sm outline-none" required>
                        </div>
                        <button type="submit" class="w-full bg-red-700 text-white py-2.5 rounded-xl text-sm font-bold shadow-md hover:bg-red-800 transition-colors">
                            Generate Link
                        </button>
                    </form>
                    <div id="inviteResult" class="mt-4 p-3 bg-red-50 rounded-xl text-[11px] break-all hidden"></div>
                </div>

            </div>
        </div>
    </main>

    <footer class="bg-white border-t py-12 mt-20">
        <div class="max-w-7xl mx-auto px-6 text-center">
            <div class="text-xl font-bold mb-4" style="color: var(--thai-red);">ว.<span>Studio</span></div>
            <p class="text-xs text-gray-400 mb-2">© 2026 วศินทราสตูดิโอ (Wasintra Studio). All rights reserved.</p>
            <div class="flex justify-center gap-4 text-[10px] font-bold text-gray-400 uppercase tracking-widest">
                <a href="policy.html" class="hover:text-[#721c24]">Privacy Policy</a>
                <span>|</span>
                <a href="terms.html" class="hover:text-[#721c24]">Terms of Service</a>
            </div>
        </div>
    </footer>

</body>
</html>
